# Accepted differences between the Lean build and the pinned Rust build (D6). A compared step
# that differs passes only if an entry's matcher covers it. Matcher fields:
#   match.op              operation name
#   match.argsContainAny  substrings, any of which the compact request arguments contain
#   match.lean/match.rust outcome patterns: ok, err, err:<code>, *

[[deviation]]
id = "lean-no-tm-path"
summary = "The Lean build registers no SQL table functions: tm_path is unavailable through SQL; paths stay available through every other surface."
spec = "openspec/changes/m0-lean-foundation/specs/sqlite-binding/spec.md#No SQL table functions or user functions"
match.op = "sqlPrepare"
match.argsContainAny = ["tm_path"]
match.lean = "err:Sqlite"
match.rust = "ok"

[[deviation]]
id = "lean-no-sql-functions"
summary = "The Lean build registers no SQL user functions (the Rust tm_* UDFs) and no rarray table function on its connections."
spec = "openspec/changes/m0-lean-foundation/specs/sqlite-binding/spec.md#No SQL table functions or user functions"
match.op = "sqlPrepare"
match.argsContainAny = ["rarray", "tm_lit", "tm_num", "tm_str", "tm_lang", "tm_dt", "tm_kind", "tm_cast", "tm_regex", "tm_sortkey", "tm_vkey", "tm_vkind"]
match.lean = "err:Sqlite"
match.rust = "ok"

# M1 (m1-verified-codec). The codec harness (`oracle codec fuzz`) accepts the two decoding
# deviations only after checking the id really has the deviating shape (Oracle.Codec.strictDeviation).

[[deviation]]
id = "lean-strict-shortstr-padding"
summary = "A SHORT_STR id with non-zero bytes after its length is rejected on decode (InvalidTerm); Rust ignores the padding. Rust never writes such ids."
spec = "openspec/changes/m1-verified-codec/specs/object-encoding/spec.md#Inline encode and decode round trip"
match.op = "codecDecode"
match.lean = "err:InvalidTerm"
match.rust = "ok"

[[deviation]]
id = "lean-strict-origin-decode"
summary = "An inline NODE/BNODE/STMT/TX id with a non-zero origin is rejected on decode (Unsupported), as well as on input; Rust decodes it."
spec = "openspec/changes/m1-verified-codec/specs/object-encoding/spec.md#Origin and counter of allocated ids"
match.op = "codecDecode"
match.lean = "err:Unsupported"
match.rust = "ok"

[[deviation]]
id = "lean-next-term-bound"
summary = "next_term is bounded at 2^60 - 1 with IdSpaceExhausted { kind: TERM }; Rust leaves it unbounded. Unreachable in practice."
spec = "openspec/changes/m1-verified-codec/specs/term-dictionary/spec.md#Ids are never reused and terms never change"
match.op = "termIntern"
match.lean = "err:IdSpaceExhausted"
match.rust = "ok"

[[deviation]]
id = "lean-no-planner-statistics"
summary = "The Lean build writes no sqlite_stat1/sqlite_stat4 (no PRAGMA optimize at open); files open in both builds with or without them."
spec = "openspec/changes/m1-verified-codec/specs/storage-format/spec.md#Planner statistics are outside the format"
match.op = "open"
match.lean = "ok"
match.rust = "ok"

# M2 (m2-verified-store).

[[deviation]]
id = "lean-graphs-dedup"
summary = "Graphs of a view are a set: Rust lists a graph once per visible declaration when sys:inGraph was never interned (its SQL then has neither UNION nor DISTINCT). Checked by `oracle store`, which accepts it only when deduplicating Rust's list gives Lean's."
spec = "openspec/changes/m2-verified-store/specs/named-graph-membership/spec.md#Membership reads on a view"
match.op = "graphs-dedup-checked-in-oracle-store"
match.lean = "ok"
match.rust = "ok"

[[deviation]]
id = "lean-io-free-bodies"
summary = "Transaction bodies and speculative queries are IO-free programs (TxProg/ReadProg), so a re-entrant write cannot be expressed; Rust rejects it at runtime with Reentrant."
spec = "openspec/changes/m2-verified-store/specs/transaction-log/spec.md#Transaction bodies cannot perform IO"
match.op = "reentrant-write-not-expressible"
match.lean = "ok"
match.rust = "err:Reentrant"

[[deviation]]
id = "lean-view-snapshot"
summary = "A Lean view holds one WAL snapshot for its whole scope; Rust takes a snapshot per read."
spec = "openspec/changes/m2-verified-store/specs/connection-concurrency/spec.md#A view is pinned to a committed snapshot"
match.op = "view-snapshot-scope"
match.lean = "ok"
match.rust = "ok"

[[deviation]]
id = "lean-instant-range"
summary = "Instants are integers in the core; one outside the signed 64-bit range fails the transaction with a store error; Rust overflows."
spec = "openspec/changes/m2-verified-store/specs/transaction-log/spec.md#Strictly increasing instants for any clock"
match.op = "instant-out-of-range"
match.lean = "err:Sqlite"
match.rust = "ok"

[[deviation]]
id = "lean-supersede-replay-selfref"
summary = "A supersede replay whose rewritten subject or object equals its own new eid (only possible when a statement refers to an eid not issued yet) fails with SelfReference; Rust checks only the root's object and inserts it."
spec = "openspec/changes/m2-verified-store/specs/statement-lifecycle/spec.md#No direct self-reference"
match.op = "supersede-replay-self-reference"
match.lean = "err:SelfReference"
match.rust = "ok"

[[deviation]]
id = "lean-speculation-store-error-burn"
summary = "When a speculation or dry run fails with a SQLite storage error inside its body, the ids it allocated are not burned (the body's counters are lost with the aborted transaction); Rust burns them from memory. IO-free bodies cannot leak those ids."
spec = "openspec/changes/m2-verified-store/specs/speculative-transactions/spec.md#Ids allocated in speculation are burned"
match.op = "speculation-storage-failure"
match.lean = "err:Sqlite"
match.rust = "err:Sqlite"
